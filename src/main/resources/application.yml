spring:
  application:
    name: waitless-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/waitless}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

firebase:
  credentials:
    # Absolute or classpath: path to the Firebase service account JSON.
    # When empty, Firebase verification is disabled and authenticated endpoints return 503.
    path: ${FIREBASE_CREDENTIALS_PATH:}
  mock:
    enabled: ${FIREBASE_MOCK_ENABLED:false}
    token: ${FIREBASE_MOCK_TOKEN:waitless-local-token}
    firebase-uid: ${FIREBASE_MOCK_UID:mock-user-001}
    email: ${FIREBASE_MOCK_EMAIL:owner@example.com}
    display-name: ${FIREBASE_MOCK_DISPLAY_NAME:Demo Owner}

logging:
  level:
    com.bl2026: DEBUG
